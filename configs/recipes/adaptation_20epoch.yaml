protocol: supervised_acdc_replay
train:
  epochs: 20
  batch_size: 1
  gradient_accumulation_steps: 8
  drop_last: false
  num_workers: 2
  lr: 0.00001
  weight_decay: 0.01
  head_lr_multiplier: 1.0
  poly_power: 1.0
  warmup_steps: 20
  amp: true
  amp_dtype: float16
  max_steps: null
  freeze_batch_norm_stats: true
