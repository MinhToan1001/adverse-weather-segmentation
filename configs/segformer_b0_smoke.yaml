experiment: smoke
seed: 42
model:
  checkpoint: null
  num_labels: 19
  hidden_sizes:
  - 16
  - 32
  - 64
  - 128
  depths:
  - 1
  - 1
  - 1
  - 1
  decoder_hidden_size: 32
  pretrained: false
data:
  train_manifest: data/manifests/synthetic_train.csv
  val_manifest: data/manifests/synthetic_val.csv
  image_size:
  - 64
  - 64
  preprocessing:
    keep_aspect_ratio: true
    image_interpolation: bilinear
    mask_interpolation: nearest
    mask_padding: 255
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
train:
  batch_size: 2
  gradient_accumulation_steps: 1
  num_workers: 0
  epochs: 1
  max_steps: 2
  lr: 0.0001
  weight_decay: 0.01
  warmup_steps: 0
  amp: false
output_dir: outputs/smoke
