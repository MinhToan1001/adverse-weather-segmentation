experiment: segformer_b0_cityscapes
seed: 42
model:
  checkpoint: nvidia/mit-b0
  revision: 80983a413c30d36a39c20203974ae7807835e2b4
  num_labels: 19
  pretrained: true
data:
  train_manifest: data/manifests/cityscapes_train.csv
  val_manifest: data/manifests/cityscapes_val.csv
  image_size:
  - 512
  - 1024
  augment:
    min_scale: 0.5
    max_scale: 2.0
    horizontal_flip: 0.5
  preprocessing:
    keep_aspect_ratio: true
    image_interpolation: bilinear
    mask_interpolation: nearest
    mask_padding: 255
    mean:
    - 0.485
    - 0.456
    - 0.406
    std:
    - 0.229
    - 0.224
    - 0.225
train:
  batch_size: 1
  gradient_accumulation_steps: 4
  num_workers: 2
  epochs: 30
  max_steps: null
  lr: 6.0e-05
  weight_decay: 0.01
  poly_power: 1.0
  warmup_steps: 1500
  amp: true
  amp_dtype: float16
output_dir: outputs/segformer_b0_cityscapes
